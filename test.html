<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Load Test</title>
</head>
<body>
    <h1>Script Load Test</h1>
    <div id="output"></div>

    <script src="js/database.js"></script>
    <script src="js/main.js"></script>
    <script>
        const output = document.getElementById('output');

        // Test 1: Check if database loaded
        if (typeof getAllJewelry !== 'undefined') {
            output.innerHTML += '<p style="color: green;">✅ Database functions loaded</p>';

            try {
                const jewelry = getAllJewelry();
                output.innerHTML += `<p style="color: green;">✅ Database has ${jewelry.length} items</p>`;

                const popular = getPopularJewelry();
                output.innerHTML += `<p style="color: green;">✅ Popular items: ${popular.length}</p>`;
            } catch (error) {
                output.innerHTML += `<p style="color: red;">❌ Database error: ${error.message}</p>`;
            }
        } else {
            output.innerHTML += '<p style="color: red;">❌ Database functions NOT loaded</p>';
        }

        // Test 2: Check if ScaleRenderer loaded
        if (typeof ScaleRenderer !== 'undefined') {
            output.innerHTML += '<p style="color: green;">✅ ScaleRenderer loaded</p>';
        } else {
            output.innerHTML += '<p style="color: red;">❌ ScaleRenderer NOT loaded</p>';
        }

        // Test 3: Check if MeasurementStandards loaded
        if (typeof MeasurementStandards !== 'undefined') {
            output.innerHTML += '<p style="color: green;">✅ MeasurementStandards loaded</p>';
        } else {
            output.innerHTML += '<p style="color: red;">❌ MeasurementStandards NOT loaded</p>';
        }

        // List all window properties related to our app
        output.innerHTML += '<h2>Available Functions:</h2>';
        const ourFunctions = Object.keys(window).filter(key =>
            key.includes('Jewelry') ||
            key.includes('getAll') ||
            key.includes('getPopular') ||
            key.includes('Scale') ||
            key.includes('Measurement')
        );
        output.innerHTML += '<ul>' + ourFunctions.map(fn => `<li>${fn}</li>`).join('') + '</ul>';
    </script>
</body>
</html>
